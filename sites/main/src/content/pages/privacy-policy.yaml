      "body": "- Responding to enquiries: to reply to your enquiry and discuss the work you're asking about — necessary to take steps you request before a contract, or our legitimate interest in running the business.\n\n- Job applications: to assess your suitability for a role and contact you about it — necessary to take steps you request before an employment contract.\n\n- Internal notifications: when you submit a form, a summary is emailed to our team and posted to an internal Slack channel so a person can respond promptly — our legitimate interest in a timely service.\n\n- Analytics, only with consent: to understand how the site is used and improve it, using Google Analytics 4 and Microsoft Clarity — based on your consent, which you can withdraw at any time.\n\n- Fraud and abuse prevention: Cloudflare Turnstile tells people from bots on our forms, and we keep a short-lived, hashed record of submission attempts to prevent spam — our legitimate interest in keeping the site secure."
