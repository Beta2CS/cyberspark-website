      "title": "Online Proctoring That Leaves the Decision to People",
      "body": "Proctoring software is only useful if reviewers trust what it shows. SparkTalent records evidence, not verdicts: a snapshot when a second person appears in frame, a timestamp when the candidate leaves the tab, an audio flag when someone else is talking. Reviewers see each flag in context on a single timeline and decide what it means.\n\nThat matters because flags have innocent explanations: a family member walking past, a notification pulling focus, a slow connection. A good process treats a flag as a question to look into, not an automatic fail.\n\n| Setting | When to switch it on |\n| --- | --- |\n| Face and presence tracking | Any stage where identity or independent work matters |\n| Tab and fullscreen monitoring | Knowledge tests and timed tasks |\n| Screen capture at intervals | Coding and QA tasks, where you want to see the working |\n| Voice monitoring | Video interviews and written tasks done from home |\n| Multi-monitor detection | High-stakes final stages |\n\nEach setting is configured per stage, so a quick MCQ screen can stay light while a final technical task has full proctoring.\n\n### Candidate data and the UK GDPR\n\nAssessments collect personal data, including video and audio. Tell candidates before they start what is recorded and why, keep recordings only as long as your hiring process needs them, and limit who on your team can view them. SparkTalent's role-based access means interviewers see only the candidates and evidence they are assigned to.\n\n### Pre-employment assessment for any role\n\nSparkTalent isn't only a coding assessment platform. Operations, analyst, marketing and leadership roles can be assessed with MCQs, written tasks and one-way video interviews; designers and architects can upload portfolios and case studies. Use the Git and QA tasks where the role is technical."
