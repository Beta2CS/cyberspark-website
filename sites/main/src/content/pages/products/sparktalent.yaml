      "body": "SparkTalent replaces your scattered hiring process with a single platform. Here is how your team uses it, from job posting to onboarding.\n\n### 1. Post a Role\n\nCreate a career listing directly in the SparkTalent admin panel. Define the job title, description, location, and application questions. Your listing is ready in minutes — no separate job board needed.\n\n### 2. Build Your Assessment\n\nAttach a multi-stage assessment to your job posting. Each stage can contain different question categories — mix MCQs for quick knowledge screening, written essays for analytical thinking, one-way video interviews for communication and cultural fit, Git coding tasks for engineers, and QA testing on deployed apps for testers. Set a timer for each question and configure [AI proctoring](/products/sparktalent#ai-proctoring) per stage.\n\n### 3. Invite Candidates\n\nSend branded email invitations with a single click. Need to migrate from another ATS? Import your entire candidate pipeline via JSON — names, emails, resumes, and application data transfer over cleanly. Send reminder emails to candidates who have not started yet.\n\n### 4. Candidates Complete the Assessment\n\nEach candidate gets a guided tutorial walkthrough before starting. The platform handles permissions (camera, microphone, screen share) step-by-step. A countdown timer keeps every question fair, and a built-in live chat widget connects candidates to your support team if they need help.\n\n### 5. Review and Score\n\nMultiple reviewers on your team can independently score each candidate. Every score includes the reviewer's name and written reasoning, so your hiring committee has full context. View [proctoring evidence](/products/sparktalent#ai-proctoring), video playbacks, code commits, and written responses — all in one admin dashboard.\n\n### 6. Shortlist and Onboard\n\nSend customisable welcome emails to shortlisted candidates. If you are hiring in India, onboard pre-vetted engineers directly through [Employer of Record (EOR) service](/services/hire-developers-in-india/eor) — no local entity required.\n\n5 ASSESSMENT TYPES FOR EVERY ROLE\n\nMultiple Choice (MCQ) Auto-graded knowledge screening with rich-formatted options. Best for rapid shortlisting across all roles.\n\nWritten / Essay Response Long-form answers scored against a rubric, so every reviewer judges analysts and managers on the same criteria.\n\nOne-Way Video Interview Assess communication skills via timed, auto-saved webcam recordings that your team can review at their own pace.\n\nLive Coding Environments Evaluate engineers using real-world Git workflows, custom coding tasks, and automated QA testing directly in the browser.\n\nFile & Portfolio Uploads Perfect for designers and architects. Candidates securely submit presentations, case studies, or architecture diagrams for review.\n\n### Git Repository Task\n\nBest for software engineers and full-stack developers. Candidates clone a real Git repository directly into VS Code, write actual code, and push their commits. Your reviewers inspect the real codebase — not a synthetic puzzle on a whiteboard. Integrates with GitLab for automatic fork creation per candidate. Pre-assessed engineers can transition directly to client projects via [Bespoke Software Development](/services/bespoke-software-development).\n\n![SparkTalent Live Git Assessment Engine](/media/imported/sparktalent-live-git-assessment-engine-1600.webp)\n\n### Deployed URL / QA Testing\n\nBest for QA engineers, testers, and frontend developers. Candidates open a live staging application in their browser, explore it, find bugs, and document their findings in a rich-text editor. This tests real-world debugging skills on a real product — not hypothetical scenarios.\n\n![SparkTalent Deployed URL Testing](/media/imported/chatgpt-image-aug-27-2026-12-04-01-pm-1600.webp)"
