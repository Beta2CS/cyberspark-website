      "title": "File Dormant Company Accounts Online",
      "body": "A dormant company still has to file accounts with Companies House every year, within 9 months of the end of its financial year. Filing the accounts is free at Companies House, but a late filing penalty starts at £150 for a private company and rises to £1,500 if the accounts are more than six months late. The penalty is doubled if the accounts are late two years in a row.\n\nWith FileMyLtd you answer a short set of questions to confirm the company really was dormant, then the software prepares the dormant accounts, checks them and sends them to Companies House once you approve. You will need your company authentication code from Companies House to file.\n\n- Dormancy questions that walk through each type of transaction, so you know whether the company qualifies.\n\n- Last year's figures carried across automatically.\n\n- Deadline reminders 60, 30, 14, 7 and 1 days before the accounts are due.\n\nA dormant company usually doesn't file a CT600 unless HMRC sends it a notice to deliver one. If your company starts trading, you can move it to the micro-entity plan and last year's dormant figures carry across as comparatives.\n\n![The FileMyLtd four-step process, starting from a company number](/media/imported/filemyltd-how-it-works-1440.webp)"
