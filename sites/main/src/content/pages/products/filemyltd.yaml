      "title": "Micro-Entity Accounts and the CT600 in One Place",
      "body": "A company is a micro-entity if it meets at least two of these three limits (for accounting periods starting on or after 6 April 2025):\n\n| Limit | Micro-entity |\n| --- | --- |\n| Annual turnover | £1 million or less |\n| Balance sheet total | £500,000 or less |\n| Average number of employees | 10 or fewer |\n\nFileMyLtd prepares the micro-entity accounts for Companies House, then starts your CT600 Company Tax Return from the accounts you have just approved:\n\n- Adjust for tax items, such as client entertaining and capital allowances.\n\n- See the Corporation Tax worked out, with each step shown, including marginal relief for profits between £50,000 and £250,000.\n\n- Validate, then submit to HMRC with your company's Unique Taxpayer Reference (UTR) and HMRC sign-in details.\n\nThe CT600 is due 12 months after the end of the accounting period, but Corporation Tax is usually payable 9 months and 1 day after it. FileMyLtd reminds you of both.\n\nFileMyLtd is built for straightforward small companies. If your company claims R&D relief, group relief or has overseas income, an accountant is the better choice.\n\nIs FileMyLtd Right for You?"
