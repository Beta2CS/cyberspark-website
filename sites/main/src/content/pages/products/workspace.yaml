      "body": "Our engineers work across the UK and India. Before WorkSpace, a simple question such as \"can we ship this on Friday?\" meant checking a leave spreadsheet, two holiday calendars, a standup document and three GitHub tabs. Each tool was fine on its own; together they cost a little time from everyone, every day, and things still slipped through: a release planned on an Indian public holiday, a pull request waiting for a reviewer who was on annual leave.\n\nWorkSpace puts those pieces in one place. It is not trying to replace your HR system or your whole project management stack. It answers the questions a software team asks every day:\n\n- Who is available this week, in which country, and who is on leave?\n\n- What did we agree in this morning's standup, and who owns each action?\n\n- Where is the work: which branch, which pull request, and is it waiting for review?\n\nIf your team is small, co-located and happy with a spreadsheet, you probably don't need it. It earns its place when a team spans locations, leave policies or Git repositories, and the overhead of keeping everyone in sync starts to show."
