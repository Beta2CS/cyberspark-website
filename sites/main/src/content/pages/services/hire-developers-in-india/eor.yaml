      "body": "CyberSpark provides full-lifecycle employment and statutory governance in India under a single UK-law contract. You manage the engineering work; CyberSpark handles the legal employment infrastructure.\n\n### Employment Contracts\n\nCompliant offer letter and appointment letter issued in Indian law. Role description, compensation structure, notice period, and IP assignment clause — all reviewed and issued by CyberSpark before the engineer's first day.\n\n### Monthly INR Payroll\n\nGross salary disbursed to the employee's Indian bank account monthly on a reliable schedule. Digital payslips issued in compliant format. All statutory deductions accurately calculated and applied.\n\n### Integrated Tooling\n\nCandidate screening via [SparkTalent](/products/sparktalent) in real Git repos with live automated QA. Multi-country leave tracking via [WorkSpace](/products/workspace) keeping Indian statutory leave and UK sprint schedules synchronised.\n\n### Your Monthly Invoice\n\nOne consolidated invoice in GBP covering gross salary, employer statutory contributions, and CyberSpark's management fee. Zero INR currency exposure, no Indian tax filings, and no statutory registrations on your side.\n\n### Statutory Contributions, Managed in Full\n\nEvery statutory requirement under Indian labour law below is monitored and remitted directly by CyberSpark:\n\n| Statutory requirement | Governing authority / Act | Rate |\n| --- | --- | --- |\n| Provident Fund (PF) | Code on Social Security, 2020 (EPFO) | 12% of wages (allowances above 50% of pay count as wages) |\n| Employee State Insurance (ESI) | Code on Social Security, 2020 (ESIC) | 3.25% employer, for wages up to ₹21,000 a month |\n| Professional Tax (PT) | State-specific enactments (e.g. Karnataka, Maharashtra) | Set by each state, capped at ₹2,500 a year |\n| TDS on Salary | Income-tax Act, 2025 (section 192 of the 1961 Act until March 2026) | Per income tax slab |\n| Annual Form 16 | Certificate of Tax Deducted at Source (UK P60 equivalent) | Annual statutory issuance |\n| Gratuity | Code on Social Security, 2020 | 15 days' wages per year of service, after 5 years (1 year for fixed-term staff) |\n\nThese rates follow India's four labour codes, which came into force on 21 November 2025 and replaced the older Acts (including the EPF Act, 1952, the ESI Act, 1948 and the Payment of Gratuity Act, 1972). For a walkthrough of the whole process, from choosing the model to an employee's exit, read our step-by-step Employer of Record guide for UK companies. For dedicated statutory employment services and loaded salary cost modeling, you can also explore our specialised portal at [EOR Services UK](https://www.eor-services.co.uk/)."
