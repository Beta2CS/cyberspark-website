andover | 100% retained by client |\n| Pricing & billing | Monthly loaded salary + EOR fee (GBP) | Fixed-price milestone disbursements | Agreed daily or monthly rate |\n| Commitment & minimum term | Notice period (30–90 days) | Project timeline (8–16 weeks) | Short-term (1–6 months) |\n| Indian entity required | No | No | No |"
