      "title": "Why PEO Is Rarely the Right Model for India",
      "body": "PEO as a recognised employment structure is primarily an American legal construct. The United States maintains a defined statutory framework for co-employment governed under [26 U.S. Code § 7705 →](https://www.irs.gov/charities-non-profits/certified-professional-employer-organizations) and state-level workers' compensation acts.\n\nIn India, no equivalent co-employment statute exists under the [Ministry of Labour & Employment →](https://labour.gov.in/) framework. Third-party staffing in India is governed by the Occupational Safety, Health and Working Conditions Code, 2020, which replaced the Contract Labour (Regulation and Abolition) Act, 1970 when India's labour codes came into force on 21 November 2025; the alternative is direct employment through an Employer of Record. For how an EOR arrangement works in practice, see our EOR guide → or our dedicated UK portal [EOR Services UK →](https://www.eor-services.co.uk/).\n\nThe Litmus Test for UK Companies\n\n### Who Is the Legal Employer on the Payslip?\n\nIf you are a UK company without an Indian entity and a provider markets their service as a \"Global PEO for India\", ask them directly: \"Whose registered corporate entity name appears on the employee's contract and payslip?\" If the answer is \"our local Indian entity, not yours\", you are entering an EOR arrangement regardless of marketing terminology."
