      "eyebrow": "Compensation Mechanics",
      "title": "How Salary Structure Works in India",
      "body": "Indian compensation is typically structured with distinct statutory components — not just a single gross salary figure as is common in UK employment. Understanding the structure is vital for accurate engineering budget planning:\n\n| Salary Component | Typical % of CTC | Statutory & Tax Implications |\n| --- | --- | --- |\n| Basic Salary | 40–50% of CTC | Provident Fund (PF) is calculated strictly on basic salary. Structuring basic properly optimizes statutory costs while ensuring compliance. |\n| House Rent Allowance (HRA) | 40–50% of basic | Partially tax-exempt if the employee submits rent receipts; directly reduces employee TDS burden. |\n| Special Allowance | Remainder | Fully taxable component; used flexibly to balance the overall compensation package. |\n| Variable / Performance Pay | 10–20% of CTC | Paid upon milestone or quarterly achievement; taxable in the specific month disbursed. |\n| Statutory Bonus | Mandatory (5.83% of basic) | Payable annually in accordance with the Payment of Bonus Act. |\n\nUnderstanding \"Cost to Company\" (CTC)\n\nCTC (Cost to Company) is the total employer cost — comprising gross salary plus employer-side statutory contributions (PF and ESI). UK companies accustomed to offering a gross salary should note that when an Indian candidate quotes their CTC expectation, that figure already includes employer statutory obligations. CyberSpark converts candidate CTC expectations into transparent, UK-comparable loaded monthly cost proposals in GBP."
