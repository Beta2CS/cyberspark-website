      "title": "Why Indian Payroll Is Different from UK Payroll",
      "body": "UK companies familiar with PAYE often underestimate the complexity of Indian payroll. While the UK framework primarily revolves around National Insurance Contributions and Pension Auto-Enrolment, Indian employment mandates multiple overlapping statutory enactments across central and state jurisdictions:\n\n| Statutory Requirement | Governing Authority / Enactment | Rate | Compliance Notes |\n| --- | --- | --- | --- |\n| Provident Fund (PF) | Code on Social Security, 2020 (EPFO) | 12% employer on wages | Remitted monthly via EPFO portal; matched by 12% employee contribution. |\n| Employee State Insurance (ESI) | Code on Social Security, 2020 (ESIC) | 3.25% employer contribution | Mandatory for employees earning ≤ ₹21,000/month gross. |\n| Professional Tax (PT) | State Acts (e.g. Karnataka, Maharashtra PT Acts) | Set by each state, capped at ₹2,500 a year | State-level statutory deduction; remitted to the state tax authority. |\n| TDS on Salary | Income-tax Act, 2025 (section 192 of the 1961 Act until March 2026) | Per income tax slab | Employer deducts and remits monthly; annual Form 16 issued to employees. |\n| Gratuity | Code on Social Security, 2020 | 15 days' wages per year of service (about 4.81% of wages as a provision) | Terminal benefit payable after 5 years of continuous service, or 1 year for fixed-term employees. |\n\nFederal Complexity\n\n### State-Level Variation\n\nIndia is a federal country with state-specific employment rules. Karnataka, Maharashtra, Delhi, Tamil Nadu, and West Bengal each have distinct Shops and Establishments Acts, Professional Tax schedules, and local filings. CyberSpark registers in the state where each engineer works and follows that state's rules. Since 21 November 2025, India's four labour codes also apply nationally: they redefined \"wages\" (allowances above 50% of pay count towards PF and gratuity), so older salary structures should be reviewed.\n\nZero Banking Hassle\n\n### INR Currency Management\n\nDirectly running payroll requires establishing an Indian banking entity, capital remissions, and navigating local tax filings. Under CyberSpark's EOR, you eliminate this entire overhead: CyberSpark disburses in INR from our Indian entity, while you receive a single, transparent GBP invoice in the UK. For standalone statutory payroll administration and cost simulations, explore our specialised portal at [EOR Services UK Payroll ↗](https://www.eor-services.co.uk/services/payroll-services) (or run instant loaded salary calculations on the [Employer Cost Calculator ↗](https://www.eor-services.co.uk/employer-cost-calculator))."
