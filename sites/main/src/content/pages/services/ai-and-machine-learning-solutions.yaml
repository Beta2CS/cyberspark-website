      "title": "Data Protection and the Rules That Apply",
      "body": "AI features are still data processing, so the usual UK rules apply:\n\n- UK GDPR and the Data Protection Act 2018 cover any personal data an AI feature uses. We identify the lawful basis, minimise the data sent to a model, and help you complete a data protection impact assessment where the processing is high-risk.\n\n- Automated decisions. Where an AI output could significantly affect a person, such as a credit, hiring or eligibility decision, a person should review it, and people should be told how decisions are made.\n\n- Suppliers. Model providers act as processors or sub-processors, so their contracts, data locations and retention settings need checking before any personal data is sent.\n\n- Selling into the EU? The EU AI Act can apply to AI systems used in the EU, even when the provider is UK-based. We flag this early if it affects you.\n\nThe Information Commissioner's Office (ICO) publishes guidance on AI and data protection; we design to it rather than around it."
