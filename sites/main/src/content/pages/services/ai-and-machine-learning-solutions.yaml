      "body": "We choose the simplest approach that does the job reliably:\n\n- Hosted large language models from the major providers are usually the fastest way to add assistants, summarisation and drafting. We check each provider's data terms, including whether your data can be used for training and where it is processed.\n\n- Retrieval-augmented generation (RAG) is how an assistant answers from your documents: it searches your content first and answers from what it finds, with references, instead of relying on what the model happens to know.\n\n- Open-weight models you host yourself make sense when data must not leave your environment, or when volumes make hosted pricing expensive.\n\n- Classic machine learning is still the right tool for forecasting, scoring and anomaly detection on structured data, and is often cheaper and easier to explain than a language model.\n\n- Fine-tuning is rarely the first step. Better instructions, better retrieval and better data usually come first.\n\nWhatever we build, the model sits behind an interface we control, so it can be swapped when a better or cheaper option appears."
